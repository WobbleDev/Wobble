name: Nightly e2e
on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
concurrency:
  group: nightly-e2e
  cancel-in-progress: true
jobs:
  e2e:
    runs-on: macos-latest
    timeout-minutes: 90
    # The last step files an issue per failed spec with this token.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run test:e2e
        env:
          # e2e-all.sh writes every suite's results under this directory so the JSON reports can
          # be collected. Traces and screenshots stay on the runner.
          WOBBLE_E2E_RUN_DIR: test-results/run
      # The repo is public, so its artifacts are too. Traces and screenshots can show the app's
      # screen, network bodies and DOM, which the email scan cannot vet: only each suite's text
      # report leaves the runner, with its attachment lists removed.
      - name: Collect text reports
        if: failure()
        run: |
          mkdir -p e2e-reports
          for f in test-results/run/*/results.json; do
            [ -e "$f" ] || continue
            jq 'walk(if type == "object" and has("attachments") then .attachments = [] else . end)' "$f" > "e2e-reports/$(basename "$(dirname "$f")").json" || true
          done
      - name: Scan reports for non-synthetic emails
        if: failure()
        run: scripts/data-safety.sh emails e2e-reports || { rm -rf e2e-reports; exit 1; }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: e2e-report
          path: e2e-reports
          if-no-files-found: ignore
          retention-days: 3
      # One issue per failed spec, deduped by its title marker, so a nightly failure is
      # visible without reading a log that expires. The issue carries the spec path and the
      # run link only: the same text reports, never a trace or a screenshot.
      - name: File one issue per failed spec
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NIGHTLY_JOB: chromium
        run: node scripts/nightly-flake-issues.mjs e2e-reports
  # The Mac app renders in WebKit (WKWebView), so a Chromium-only run does not prove it looks
  # right. Own job so a WebKit failure shows up on its own and never hides the Chromium result.
  # Only the regular suite runs on WebKit; the state-owning suites stay Chromium-only.
  webkit:
    runs-on: macos-latest
    timeout-minutes: 90
    # The last step files an issue per failed spec with this token.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: npm ci
      - run: npx playwright install webkit
      # Tab reaching buttons follows macOS Keyboard navigation, which is off on a fresh runner.
      # Turn it on so the Tab specs test the app, not the runner's default.
      - run: defaults write -g AppleKeyboardUIMode -int 3
      - run: npm run test:e2e:webkit
        env:
          WOBBLE_E2E_RUN_DIR: test-results/run
      # Text reports only; see the Chromium job.
      - name: Collect text reports
        if: failure()
        run: |
          mkdir -p e2e-reports
          for f in test-results/run/*/results.json; do
            [ -e "$f" ] || continue
            jq 'walk(if type == "object" and has("attachments") then .attachments = [] else . end)' "$f" > "e2e-reports/$(basename "$(dirname "$f")").json" || true
          done
      - name: Scan reports for non-synthetic emails
        if: failure()
        run: scripts/data-safety.sh emails e2e-reports || { rm -rf e2e-reports; exit 1; }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: e2e-report-webkit
          path: e2e-reports
          if-no-files-found: ignore
          retention-days: 3
      - name: File one issue per failed spec
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NIGHTLY_JOB: webkit
        run: node scripts/nightly-flake-issues.mjs e2e-reports
