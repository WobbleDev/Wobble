name: Nightly e2e
on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
concurrency:
  group: nightly-e2e
  cancel-in-progress: true
jobs:
  e2e:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run test:e2e
      - name: Scan artifacts for non-synthetic emails
        if: always()
        run: scripts/data-safety.sh emails playwright-report test-results || { rm -rf playwright-report test-results; exit 1; }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 3
  # The Mac app renders in WebKit (WKWebView), so a Chromium-only run does not prove it looks
  # right. Own job so a WebKit failure shows up on its own and never hides the Chromium result.
  # Only the regular suite runs on WebKit; the state-owning suites stay Chromium-only.
  webkit:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: npm ci
      - run: npx playwright install webkit
      # Tab reaching buttons follows macOS Keyboard navigation, which is off on a fresh runner.
      # Turn it on so the Tab specs test the app, not the runner's default.
      - run: defaults write -g AppleKeyboardUIMode -int 3
      - run: npm run test:e2e:webkit
      - name: Scan artifacts for non-synthetic emails
        if: always()
        run: scripts/data-safety.sh emails playwright-report test-results || { rm -rf playwright-report test-results; exit 1; }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report-webkit
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 3
