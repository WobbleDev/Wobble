name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Docs-only PRs skip the heavy jobs (gitleaks runs in its own workflow).
  # Dependabot and lockfile PRs always count as code changes.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.f.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: f
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] || [ "${{ github.actor }}" = "dependabot[bot]" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          if echo "$files" | grep -qE '(^|/)(package-lock\.json|Cargo\.lock)$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if echo "$files" | grep -vE '^(docs/|\.github/ISSUE_TEMPLATE/)|\.md$|^(LICENSE|NOTICE)$' | grep -q .; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
  # Blocking: lint, types, unit, Rust.
  verify:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev build-essential
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run test:rust
  # Non-blocking on PRs; the full run is nightly (nightly-e2e.yml).
  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    continue-on-error: true
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run test:e2e:merge
