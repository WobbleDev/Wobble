name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Docs-only PRs skip the heavy jobs (gitleaks runs in its own workflow). Dependabot and
  # lockfile PRs always count as code changes. Among code changes, the blocking jobs follow the
  # paths: a PR that only touches Rust source skips the Node jobs (the repo-wide guards from
  # `npm run lint` still run, in `guards`), and a PR that touches nothing the Rust job reads
  # skips the Rust job. Pushes to main run everything, which also keeps the caches warm.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.f.outputs.code }}
      frontend: ${{ steps.f.outputs.frontend }}
      rust: ${{ steps.f.outputs.rust }}
      guards: ${{ steps.f.outputs.guards }}
      e2e_full: ${{ steps.f.outputs.e2e_full }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: f
        run: |
          # e2e_full: run the whole merge set. Anything that is not a plain feature or spec change
          # (dependencies, build and test config, the Rust core, shared test helpers) does, as do
          # pushes to main. Other PRs run only the areas scripts/verify-routing.ts picks.
          all_on() {
            for name in code frontend rust e2e_full; do echo "$name=true" >> "$GITHUB_OUTPUT"; done
            echo "guards=false" >> "$GITHUB_OUTPUT"
          }
          if [ "${{ github.event_name }}" != "pull_request" ] || [ "${{ github.actor }}" = "dependabot[bot]" ]; then
            all_on; exit 0
          fi
          files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          if grep -qE '(^|/)(package-lock\.json|Cargo\.lock)$' <<<"$files"; then
            all_on; exit 0
          fi
          code=false frontend=false rust=false guards=false
          if grep -vE '^(docs/|\.github/ISSUE_TEMPLATE/)|\.md$|^(LICENSE|NOTICE)$' <<<"$files" | grep -q .; then
            code=true
            # Rust-only: Rust source and Cargo manifests. Everything else (JSON, Markdown and
            # fixtures under crates/ included) is read by prettier, knip or the guard scripts.
            if grep -vE '\.rs$|(^|/)Cargo\.toml$|^(deny\.toml|rust-toolchain(\.toml)?)$|^\.cargo/' <<<"$files" | grep -q .; then
              frontend=true
            else
              guards=true
            fi
            # What `npm run test:rust` reads: the crates, the Tauri shell, the contract fixtures the
            # core replays, the generated types, the toolchain files, and the CI definition itself.
            if grep -qE '^(crates|src-tauri|contract)/|(^|/)Cargo\.toml$|^(deny\.toml|rust-toolchain(\.toml)?|package\.json)$|^\.cargo/|^src/lib/client/generated/|^\.github/(workflows/ci\.yml|actions/)' <<<"$files"; then
              rust=true
            fi
          fi
          {
            echo "code=$code"; echo "frontend=$frontend"; echo "rust=$rust"; echo "guards=$guards"
          } >> "$GITHUB_OUTPUT"
          if grep -qE '(^|/)(package\.json|Cargo\.toml)$|^(playwright\.config\.ts|vite\.config\.ts|svelte\.config\.js|tsconfig\.json)$|^(crates|src-tauri|contract|messages)/|^scripts/(e2e|verify|heavy)|^\.github/(workflows/ci\.yml|actions/)' <<<"$files" \
            || grep -E '^e2e/' <<<"$files" | grep -vqE '^e2e/[^/]+\.spec\.ts$'; then
            echo "e2e_full=true" >> "$GITHUB_OUTPUT"
          else
            echo "e2e_full=false" >> "$GITHUB_OUTPUT"
          fi
  # Blocking: lint, types, unit, Rust. The checks run as parallel jobs so the slowest one sets
  # the wall time; the `verify` job at the end is the single required check (branch protection
  # points at it) and passes when every job it needs passed or was skipped (docs-only PRs, and
  # the Node or Rust jobs a PR's paths do not touch).
  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/node-deps
      # ESLint and Prettier skip files whose content they already checked (a fresh checkout has
      # new file times, so the lint script compares content).
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .eslintcache
            node_modules/.cache/prettier
          key: lint-${{ runner.os }}-${{ hashFiles('package-lock.json', 'eslint.config.js', 'prettier.config.js') }}-${{ github.sha }}
          restore-keys: |
            lint-${{ runner.os }}-${{ hashFiles('package-lock.json', 'eslint.config.js', 'prettier.config.js') }}-
      - run: npm run lint
  types-and-unit:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/node-deps
      - run: npm run check
      - run: npm test
      # The Settings > About licence list is generated from the lockfiles' packages; a stale copy fails here.
      - run: npm run licences:check
  # A PR that only touches Rust source skips lint and types-and-unit; the guard scripts that
  # `npm run lint` starts with read every tracked file (old names, fixture PII, e2e settings
  # writes), so they still run. They use no npm packages.
  guards:
    needs: changes
    if: needs.changes.outputs.guards == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - run: node scripts/check-e2e-settings-writes.mjs && node scripts/check-fixture-pii.mjs && node scripts/check-old-names.mjs
  rust:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    # The GitHub runner has 4 cores and 16 GB; `test:rust` defaults to one job at a time for
    # small laptops, so lift that here.
    env:
      CARGO_BUILD_JOBS: 4
      RUST_TEST_THREADS: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: . -> target
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev build-essential
      - run: npm run test:rust
  verify:
    needs: [changes, lint, types-and-unit, guards, rust]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "changes=${{ needs.changes.result }} lint=${{ needs.lint.result }} types-and-unit=${{ needs.types-and-unit.result }} guards=${{ needs.guards.result }} rust=${{ needs.rust.result }}"
          case "${{ needs.changes.result }}${{ needs.lint.result }}${{ needs.types-and-unit.result }}${{ needs.guards.result }}${{ needs.rust.result }}" in
            *failure*|*cancelled*) exit 1 ;;
          esac
  # Non-blocking on PRs; the full run is nightly (nightly-e2e.yml).
  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    continue-on-error: true
    # Dependabot opens several PRs at once; share one group so only one of their macOS e2e
    # runs at a time and the rest wait instead of flooding the runner queue. Other PRs keep
    # the workflow's per-ref group (the job group is per ref and never cancels, so it
    # cannot cut a run short).
    concurrency:
      group: e2e-${{ github.actor == 'dependabot[bot]' && 'dependabot' || github.ref }}
      cancel-in-progress: false
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Two commits so HEAD^1 (the PR's base) is there for the affected-area diff.
          fetch-depth: 2
      - uses: ./.github/actions/node-deps
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: . -> target
      - run: npx playwright install chromium
      # The suites' databases are throwaway, but the app (rightly) forces a full drive flush after
      # every commit, which is slow on a CI disk. Put them on a RAM disk so the app code under test
      # stays exactly as shipped. If the disk cannot be made the suites use the runner's disk.
      - name: RAM disk for test databases
        continue-on-error: true
        run: |
          device=$(hdiutil attach -nomount ram://1048576 | awk '{print $1}')
          diskutil erasevolume HFS+ wobble-ram "$device"
          echo "WOBBLE_E2E_DB=/Volumes/wobble-ram/e2e.sqlite" >> "$GITHUB_ENV"
      - name: Run e2e
        env:
          # Write every suite's results under one directory so the JSON reports can be collected;
          # e2e-all.sh otherwise uses a temp dir. Traces and screenshots stay on the runner.
          WOBBLE_E2E_RUN_DIR: test-results/run
        run: |
          if [ "${{ needs.changes.outputs.e2e_full }}" = "true" ]; then
            npm run test:e2e:merge
          else
            # The areas the changed paths belong to (and nothing else); the nightly run is the full set.
            node scripts/verify.mjs --e2e-only --base HEAD^1
          fi
      # A PR's artifacts are public. Traces and screenshots can show the app's screen, network
      # bodies and DOM, which the email scan cannot vet, so only each suite's text report leaves
      # the runner: the JSON report with its attachment lists removed.
      - name: Collect text reports
        if: failure()
        run: |
          mkdir -p e2e-reports
          for f in test-results/run/*/results.json; do
            [ -e "$f" ] || continue
            jq 'walk(if type == "object" and has("attachments") then .attachments = [] else . end)' "$f" > "e2e-reports/$(basename "$(dirname "$f")").json" || true
          done
      - name: Scan reports for non-synthetic emails
        if: failure()
        # Redact first: a report that trips the scan keeps explaining the failure, and the log names
        # the key paths (never the values) so the source of the address can be found and fixed.
        run: |
          scripts/data-safety.sh redact e2e-reports
          scripts/data-safety.sh emails e2e-reports || { rm -rf e2e-reports; exit 1; }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: e2e-report
          path: e2e-reports
          retention-days: 3
          if-no-files-found: ignore
