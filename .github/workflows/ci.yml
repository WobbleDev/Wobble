name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Docs-only PRs skip the heavy jobs (gitleaks runs in its own workflow).
  # Dependabot and lockfile PRs always count as code changes.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.f.outputs.code }}
      e2e_full: ${{ steps.f.outputs.e2e_full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: f
        run: |
          # e2e_full: run the whole merge set. Anything that is not a plain feature or spec change
          # (dependencies, build and test config, the Rust core, shared test helpers) does, as do
          # pushes to main. Other PRs run only the areas scripts/verify-routing.ts picks.
          if [ "${{ github.event_name }}" != "pull_request" ] || [ "${{ github.actor }}" = "dependabot[bot]" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; echo "e2e_full=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          if echo "$files" | grep -qE '(^|/)(package-lock\.json|Cargo\.lock)$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"; echo "e2e_full=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if echo "$files" | grep -vE '^(docs/|\.github/ISSUE_TEMPLATE/)|\.md$|^(LICENSE|NOTICE)$' | grep -q .; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$files" | grep -qE '(^|/)(package\.json|Cargo\.toml)$|^(playwright\.config\.ts|vite\.config\.ts|svelte\.config\.js|tsconfig\.json)$|^(crates|src-tauri|contract|messages)/|^scripts/(e2e|verify|heavy)|^\.github/workflows/ci\.yml$' \
            || echo "$files" | grep -E '^e2e/' | grep -vqE '^e2e/[^/]+\.spec\.ts$'; then
            echo "e2e_full=true" >> "$GITHUB_OUTPUT"
          else
            echo "e2e_full=false" >> "$GITHUB_OUTPUT"
          fi
  # Blocking: lint, types, unit, Rust. The checks run as parallel jobs so the slowest one sets
  # the wall time; the `verify` job at the end is the single required check (branch protection
  # points at it) and passes when every job it needs passed or was skipped (docs-only PRs).
  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # ESLint and Prettier skip files whose content they already checked (a fresh checkout has
      # new file times, so the lint script compares content).
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .eslintcache
            node_modules/.cache/prettier
          key: lint-${{ runner.os }}-${{ hashFiles('package-lock.json', 'eslint.config.js', 'prettier.config.js') }}-${{ github.sha }}
          restore-keys: |
            lint-${{ runner.os }}-${{ hashFiles('package-lock.json', 'eslint.config.js', 'prettier.config.js') }}-
      - run: npm ci
      - run: npm run lint
  types-and-unit:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
  rust:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # The GitHub runner has 4 cores and 16 GB; `test:rust` defaults to one job at a time for
    # small laptops, so lift that here.
    env:
      CARGO_BUILD_JOBS: 4
      RUST_TEST_THREADS: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: . -> target
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev build-essential
      - run: npm run test:rust
  verify:
    needs: [changes, lint, types-and-unit, rust]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "changes=${{ needs.changes.result }} lint=${{ needs.lint.result }} types-and-unit=${{ needs.types-and-unit.result }} rust=${{ needs.rust.result }}"
          case "${{ needs.changes.result }}${{ needs.lint.result }}${{ needs.types-and-unit.result }}${{ needs.rust.result }}" in
            *failure*|*cancelled*) exit 1 ;;
          esac
  # Non-blocking on PRs; the full run is nightly (nightly-e2e.yml).
  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    continue-on-error: true
    # Dependabot opens several PRs at once; share one group so only one of their macOS e2e
    # runs at a time and the rest wait instead of flooding the runner queue. Other PRs keep
    # the workflow's per-ref group (the job group is per ref and never cancels, so it
    # cannot cut a run short).
    concurrency:
      group: e2e-${{ github.actor == 'dependabot[bot]' && 'dependabot' || github.ref }}
      cancel-in-progress: false
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Two commits so HEAD^1 (the PR's base) is there for the affected-area diff.
          fetch-depth: 2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: . -> target
      - run: npm ci
      - run: npx playwright install chromium
      - name: Run e2e
        run: |
          if [ "${{ needs.changes.outputs.e2e_full }}" = "true" ]; then
            npm run test:e2e:merge
          else
            # The areas the changed paths belong to (and nothing else); the nightly run is the full set.
            node scripts/verify.mjs --e2e-only --base HEAD^1
          fi
