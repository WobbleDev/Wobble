name: data-safety
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Block database, recording and evidence files
        run: scripts/data-safety.sh files
  emails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan tracked text for non-synthetic emails
        run: scripts/data-safety.sh emails src e2e crates contract messages docs static
      - name: Scan fixtures and tests for non-synthetic emails, phone numbers and addresses
        run: node scripts/check-fixture-pii.mjs
