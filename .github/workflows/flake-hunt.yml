name: Flake hunt
# Manual only. Reproduces a flaky e2e spec by running it many times on the same macOS runner
# type that CI uses, so the root cause can be found instead of retrying until green.
# Example: suite=regular, spec=e2e/workers-grip-reorder.spec.ts, repeat=20, workers=2.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: WOBBLE_E2E_SUITE (regular, mapping, ui, ...)
        default: regular
      spec:
        description: Spec path(s) or title filter passed to playwright, space separated (empty runs the whole suite)
        default: ''
      repeat:
        description: Times to run each test (--repeat-each)
        default: '20'
      workers:
        description: Playwright workers (CI uses 2)
        default: '2'
      project:
        description: Playwright project (chromium, or webkit, which forces suite=regular). Empty runs the suite's default projects.
        default: ''
      grep:
        description: Only run tests whose title matches this regular expression (empty runs all)
        default: ''
      full_keyboard_access:
        description: Set to true to turn on macOS Keyboard navigation (Tab reaches buttons) before the run
        default: ''
permissions:
  contents: read
concurrency:
  group: flake-hunt
  cancel-in-progress: false
jobs:
  hunt:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: npm ci
      - run: npx playwright install chromium webkit
      - name: Turn on macOS Keyboard navigation
        if: inputs.full_keyboard_access == 'true'
        run: defaults write -g AppleKeyboardUIMode -int 3
      - name: Run repeated
        env:
          WOBBLE_E2E_SUITE: ${{ inputs.suite }}
          WOBBLE_E2E_WORKERS: ${{ inputs.workers }}
          SPEC: ${{ inputs.spec }}
          REPEAT: ${{ inputs.repeat }}
          PROJECT: ${{ inputs.project }}
          GREP: ${{ inputs.grep }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: hunt-report.json
        run: |
          # Inputs go through env vars, never interpolated into the script.
          if [[ "$PROJECT" == webkit ]]; then
            export WOBBLE_E2E_WEBKIT=1 WOBBLE_E2E_SUITE=regular
          fi
          read -ra specs <<< "$SPEC" # several spec paths may be given, separated by spaces
          npx playwright test ${specs[@]+"${specs[@]}"} ${PROJECT:+--project="$PROJECT"} ${GREP:+--grep "$GREP"} \
            --repeat-each "$REPEAT" --trace on-first-retry --reporter=list,json
        # keep going so the summary step still reports the failure count
        continue-on-error: true
        id: run
      - name: Summarize failures
        if: always()
        run: |
          echo "outcome: ${{ steps.run.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          [[ -f hunt-report.json ]] || exit 0
          node - <<'JS'
          const fs = require("fs");
          const s = JSON.parse(fs.readFileSync("hunt-report.json", "utf8")).stats;
          const line = `passed ${s.expected}, failed ${s.unexpected}, flaky ${s.flaky}, skipped ${s.skipped}`;
          console.log(line);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, line + "\n");
          JS
      - name: Scan artifacts for non-synthetic emails
        if: always()
        run: scripts/data-safety.sh emails playwright-report test-results || { rm -rf playwright-report test-results; exit 1; }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: flake-hunt-results
          path: test-results
          retention-days: 3
          if-no-files-found: ignore
      - if: steps.run.outcome == 'failure'
        run: exit 1
