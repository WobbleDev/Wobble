[workspace]
resolver = "2"
members = ["crates/wobble-core", "crates/wobble-dev-shim", "src-tauri"]

[workspace.package]
edition = "2021"
version = "0.0.1"

[workspace.dependencies]
rusqlite = { version = "0.41", features = ["bundled-sqlcipher-vendored-openssl", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
zeroize = { version = "1" }
